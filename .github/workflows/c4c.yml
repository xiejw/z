name: c4c
run-name: ${{ github.actor }} is running tests for ${{ github.workflow }}
on: [push]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # clang pulls in compiler-rt (needed for ASAN) via recommends.
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libopenblas-dev
          clang --version

      - name: Run ASAN test
        run: make -C intelligence/c4c ASAN=1 BLAS=1 MCTS_ITER_CNT=10 MCTS_SELF_PLAY=1 clean run

      - name: Run release
        run: make -C intelligence/c4c RELEASE=1 BLAS=1 MCTS_ITER_CNT=10 MCTS_SELF_PLAY=1 clean run
