name: c4
run-name: ${{ github.actor }} is running tests for ${{ github.workflow }}
on: [push]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # run.sh pins torch==2.5.1, which only ships wheels up to Python 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sanity check
        working-directory: intelligence/c4
        run: C4_SANITY_CHECK=1 ./run.sh
